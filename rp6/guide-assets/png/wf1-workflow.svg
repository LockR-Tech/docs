<circle cx="175.0" cy="126.0" r="16" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
<rect x="37.0" y="187.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="37.0" cy="187.0" r="13" fill="#0369A1"/><text x="37.0" y="192.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>
<text x="175.0" y="214.5" text-anchor="middle" font-size="15" fill="#0F172A">Book a drone delivery: pickup point,</text>
<text x="175.0" y="233.5" text-anchor="middle" font-size="15" fill="#0F172A">receiver locker, parcel, receiver</text>
<rect x="367.0" y="279.0" width="276" height="62" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<circle cx="367.0" cy="279.0" r="13" fill="#B45309"/><text x="367.0" y="284.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>
<text x="505.0" y="306.5" text-anchor="middle" font-size="15" fill="#0F172A">Check distance ≤ 5 km, weight ≤ 5 kg,</text>
<text x="505.0" y="325.5" text-anchor="middle" font-size="15" fill="#0F172A">weather, free drone box; quote the fee</text>
<rect x="37.0" y="279.0" width="276" height="62" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
<text x="175.0" y="306.5" text-anchor="middle" font-size="15" fill="#0F172A">Booking refused</text>
<text x="175.0" y="325.5" text-anchor="middle" font-size="15" fill="#0F172A">(message shown)</text>
<rect x="37.0" y="371.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="37.0" cy="371.0" r="13" fill="#0369A1"/><text x="37.0" y="376.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>
<text x="175.0" y="398.5" text-anchor="middle" font-size="15" fill="#0F172A">Pay by VietQR (SePay)</text>
<text x="175.0" y="417.5" text-anchor="middle" font-size="15" fill="#0F172A">→ order PAID, 6-digit pickup code</text>
<rect x="367.0" y="463.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="367.0" cy="463.0" r="13" fill="#0369A1"/><text x="367.0" y="468.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">4</text>
<text x="505.0" y="490.5" text-anchor="middle" font-size="15" fill="#0F172A">Offer the pickup to the nearest</text>
<text x="505.0" y="509.5" text-anchor="middle" font-size="15" fill="#0F172A">drone technician on shift (180 s)</text>
<rect x="697.0" y="555.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="697.0" cy="555.0" r="13" fill="#0369A1"/><text x="697.0" y="560.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">5</text>
<text x="835.0" y="582.5" text-anchor="middle" font-size="15" fill="#0F172A">Accept, meet the sender, enter the</text>
<text x="835.0" y="601.5" text-anchor="middle" font-size="15" fill="#0F172A">pickup code + photo → PICKED_UP</text>
<rect x="697.0" y="647.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="697.0" cy="647.0" r="13" fill="#0369A1"/><text x="697.0" y="652.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">6</text>
<text x="835.0" y="674.5" text-anchor="middle" font-size="15" fill="#0F172A">Assign an idle drone at the launch</text>
<text x="835.0" y="693.5" text-anchor="middle" font-size="15" fill="#0F172A">locker (battery &gt; 20 %)</text>
<rect x="697.0" y="739.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="697.0" cy="739.0" r="13" fill="#0369A1"/><text x="697.0" y="744.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">7</text>
<text x="835.0" y="766.5" text-anchor="middle" font-size="15" fill="#0F172A">Confirm loading: weight, seal code,</text>
<text x="835.0" y="785.5" text-anchor="middle" font-size="15" fill="#0F172A">3 checks; then Launch</text>
<rect x="1027.0" y="831.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="1027.0" cy="831.0" r="13" fill="#0369A1"/><text x="1027.0" y="836.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">8</text>
<text x="1165.0" y="858.5" text-anchor="middle" font-size="15" fill="#0F172A">Fly to the receiver locker; ArUco read,</text>
<text x="1165.0" y="877.5" text-anchor="middle" font-size="15" fill="#0F172A">lid opens, servo releases, lid closes</text>
<rect x="367.0" y="923.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="367.0" cy="923.0" r="13" fill="#0369A1"/><text x="367.0" y="928.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">9</text>
<text x="505.0" y="950.5" text-anchor="middle" font-size="15" fill="#0F172A">Box OCCUPIED, READY_FOR_PICKUP;</text>
<text x="505.0" y="969.5" text-anchor="middle" font-size="15" fill="#0F172A">PIN sent to the receiver</text>
<rect x="1357.0" y="1015.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="1357.0" cy="1015.0" r="13" fill="#0369A1"/><text x="1357.0" y="1020.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">10</text>
<text x="1495.0" y="1042.5" text-anchor="middle" font-size="15" fill="#0F172A">Enter the PIN at the kiosk</text>
<text x="1495.0" y="1061.5" text-anchor="middle" font-size="15" fill="#0F172A">(or open by Bluetooth) → take parcel</text>
<rect x="367.0" y="1107.0" width="276" height="62" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<circle cx="367.0" cy="1107.0" r="13" fill="#0369A1"/><text x="367.0" y="1112.0" text-anchor="middle" font-size="13" font-weight="700" fill="white">11</text>
<text x="505.0" y="1134.5" text-anchor="middle" font-size="15" fill="#0F172A">Order COMPLETED, box released;</text>
<text x="505.0" y="1153.5" text-anchor="middle" font-size="15" fill="#0F172A">admin sees order and revenue</text>
<circle cx="505.0" cy="1230.0" r="16" fill="white" stroke="#0F172A" stroke-width="5"/>
