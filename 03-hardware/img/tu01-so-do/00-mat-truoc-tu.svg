<text x="250.0" y="530" font-size="30" text-anchor="middle" font-weight="700" fill="#1f2937">Ô 1</text>
<text x="250.0" y="560" font-size="14" text-anchor="middle" font-weight="400" fill="#6a1b9a">relay IN1 · khoá 1</text>
<text x="250.0" y="586" font-size="13" text-anchor="middle" font-weight="600" fill="#1565c0">XL — cửa cao 2 hàng</text>
<rect x="420.0" y="108" width="180" height="34" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="510.0" y="130" font-size="13" text-anchor="middle" font-weight="600" fill="#283593">Trục 2 (nắp trượt trên nóc)</text>
<line x1="510.0" y1="142" x2="510.0" y2="166" stroke="#3949ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="680.0" y="108" width="180" height="34" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
