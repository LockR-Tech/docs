<text x="770.0" y="292" font-size="14" text-anchor="middle" font-weight="400" fill="#6a1b9a">relay IN3 · khoá 3</text>
<text x="770.0" y="318" font-size="13" text-anchor="middle" font-weight="600" fill="#b26a00">DRONE · dưới trục 1</text>
<rect x="388" y="378" width="244" height="154" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
