<text x="510.0" y="292" font-size="14" text-anchor="middle" font-weight="400" fill="#6a1b9a">relay IN2 · khoá 2</text>
<text x="510.0" y="318" font-size="13" text-anchor="middle" font-weight="600" fill="#b26a00">DRONE · dưới trục 2</text>
