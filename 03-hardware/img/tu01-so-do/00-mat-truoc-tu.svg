<text x="770.0" y="432" font-size="30" text-anchor="middle" font-weight="700" fill="#1f2937">Ô 7</text>
<text x="770.0" y="462" font-size="14" text-anchor="middle" font-weight="400" fill="#6a1b9a">relay IN7 · khoá 7</text>
