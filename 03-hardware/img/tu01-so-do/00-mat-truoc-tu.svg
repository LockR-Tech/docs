<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="840" viewBox="0 0 1420 840" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1420" height="840" fill="#ffffff"/>
<text x="24" y="38" font-size="24" text-anchor="start" font-weight="700" fill="#1f2937">Mặt trước tủ CAB-TU01 — số ô, relay và trục nắp</text>
<text x="24" y="62" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280">Ô N trên admin = relay IN N = khoá N (slot = N − 1 trong code). Lưới: hàng 1–3 từ trên xuống, cột trái–giữa–phải.</text>
<rect x="90" y="170" width="840" height="570" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/>
<rect x="128" y="208" width="244" height="154" rx="10" fill="#f5f5f5" stroke="#607d8b" stroke-width="2"/>
<text x="250.0" y="290.0" font-size="15" text-anchor="middle" font-weight="400" fill="#6b7280" font-style="italic">Không có khoá</text>
