<text x="770.0" y="602" font-size="30" text-anchor="middle" font-weight="700" fill="#1f2937">Ô 5</text>
<text x="770.0" y="632" font-size="14" text-anchor="middle" font-weight="400" fill="#6a1b9a">relay IN5 · khoá 5</text>
