<line x1="770.0" y1="142" x2="770.0" y2="166" stroke="#3949ab" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="950" y="210" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ô 2, ô 3 là ô DRONE — drone thả hàng</text>
<text x="950" y="228" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">qua nắp trượt trên nóc:</text>
<text x="950" y="246" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">  • trục 1 nằm trên ô 3 (LID1_BOXES=3)</text>
<text x="950" y="264" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">  • trục 2 nằm trên ô 2 (LID2_BOXES=2)</text>
<text x="950" y="282" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937"></text>
<text x="950" y="300" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Ô trên cùng bên trái chỉ là tấm che,</text>
<text x="950" y="318" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">không có khoá.</text>
<text x="950" y="336" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937"></text>
<text x="950" y="354" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">Vị trí ô đã được đối chiếu bằng cách</text>
<text x="950" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">mở từng relay (2026-10-04) và ghi vào</text>
<text x="950" y="390" font-size="13" text-anchor="start" font-weight="400" fill="#1f2937">bảng ô của tủ trên production.</text>
