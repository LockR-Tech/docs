<text x="24" y="38" font-size="24" text-anchor="start" font-weight="700" fill="#1f2937">Sơ đồ khối — phần công suất 12 V tách riêng phần tín hiệu của Pi</text>
<text x="24" y="62" font-size="14" text-anchor="start" font-weight="400" fill="#6b7280">Hai bên chỉ gặp nhau qua opto trong driver TB6600 và tiếp điểm relay. GND của Pi KHÔNG nối vào −V của nguồn 12 V.</text>
